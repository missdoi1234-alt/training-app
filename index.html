/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const K=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const P=k=>{const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const TK=()=>K(new Date());
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const longDate=k=>{const d=P(k);return DN[d.getDay()]+' '+d.getDate()+' '+MN[d.getMonth()]};
const shortDate=k=>{const d=P(k);return DS[d.getDay()]+' '+d.getDate()+' '+MN[d.getMonth()].slice(0,3)};
function fmtT(hm){if(!hm)return '';const p=hm.split(':').map(Number);if(D.set.h24)return pad(p[0])+':'+pad(p[1]);const h=p[0]%12||12;return h+':'+pad(p[1])+(p[0]<12?' am':' pm')}
function sleepMins(b,w){if(!b||!w)return 0;const t=s=>{const p=s.split(':').map(Number);return p[0]*60+p[1]};let m=t(w)-t(b);if(m<=0)m+=1440;return m}
const Lt=v=>String(+(v/1000).toFixed(2));
const hm=m=>{const h=Math.floor(m/60),r=m%60;return h+(h===1?' hour ':' hours ')+r+(r===1?' minute':' minutes')};
const mmss=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+pad(s%60)};

function lum(hex){const h=hex.replace('#','');const c=[0,2,4].map(i=>{let v=parseInt(h.slice(i,i+2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}

function chart(labels,vals,max,unit,ticks){
  const W=360,H=176,L=36,B=24,Tp=18,cw=(W-L-6)/labels.length;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${unit} chart">`;
  ticks.forEach(v=>{const y=Tp+(H-Tp-B)*(1-v/max);s+=`<line x1="${L}" x2="${W-4}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="0.6"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--sub)">${v}</text>`});
  labels.forEach((l,i)=>{const v=vals[i],h=(H-Tp-B)*Math.min(v,max)/max,x=L+i*cw+cw*.2,bw=cw*.6,y=H-B-h;s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="var(--ac)"/><text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--tx)">${v}</text><text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--sub)">${l}</text>`});
  return s+`<text x="2" y="10" font-size="10" fill="var(--sub)">${unit}</text></svg>`;
}
const niceMax=(m,step)=>Math.max(step,Math.ceil(m/step)*step);
const ticksFor=(max,step)=>{const t=[];for(let v=0;v<=max;v+=step)t.push(v);return t};
const dropSVG=(f,w,h)=>`<svg width="${w||26}" height="${h||32}" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 2C12 2 3 13 3 19a9 9 0 0 0 18 0C21 13 12 2 12 2Z" fill="${f?'var(--ac)':'none'}" stroke="var(--ac)" stroke-width="1.6"/></svg>`;

V.stats=()=>{

  if(m){from=new Date(now.getFullYear(),now.getMonth(),1);to=new Date(now.getFullYear(),now.getMonth()+1,1)}else{from=monday(now);to=addD(from,7)}
  const S=D.sessions.filter(s=>{const d=P(s.date);return d>=from&&d<to});
  const mins=S.reduce((a,s)=>a+s.mins,0);
  const byT=Object.keys(CATS).map(c=>[CATS[c].n,S.filter(s=>catOf(s.type)===c).length]),mx=Math.max(1,...byT.map(x=>x[1]));
  let cl,cv,ctitle;
  if(m){const n=Math.ceil(new Date(now.getFullYear(),now.getMonth()+1,0).getDate()/7);cl=[];cv=[];for(let w=0;w<n;w++){cl.push('Wk '+(w+1));cv.push(S.filter(s=>Math.floor((P(s.date).getDate()-1)/7)===w).reduce((a,s)=>a+s.mins,0))}ctitle='Minutes trained each week'}
  else{const idx=[1,2,3,4];S.forEach(s=>{const i=(P(s.date).getDay()+6)%7;if(!idx.includes(i))idx.push(i)});idx.sort((a,b)=>a-b);cl=idx.map(i=>DS[(i+1)%7]);cv=idx.map(i=>sessOn(K(addD(from,i))).reduce((a,s)=>a+s.mins,0));ctitle='Session length'}
  const cmax=niceMax(Math.max(...cv,m?60:40),m?50:20);
  let drops,dropN=0;
  if(m){const days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),off=(from.getDay()+6)%7;let g=['M','T','W','T','F','S','S'].map(x=>`<div class="hd">${x}</div>`).join('')+'<span></span>'.repeat(off);for(let d=1;d<=days;d++){const k=K(new Date(now.getFullYear(),now.getMonth(),d)),f=waterTotal(k)>=1000;if(f)dropN++;g+=`<div style="text-align:center">${dropSVG(f,20,25)}</div>`}drops=`<div class="cal" style="gap:2px">${g}</div>`}
  else{drops=`<div class="wk" style="gap:2px">${[0,1,2,3,4,5,6].map(i=>{const k=K(addD(from,i)),f=waterTotal(k)>=1000;if(f)dropN++;return `<div style="text-align:center;font-size:11px;color:var(--sub)">${dropSVG(f)}<br>${'MTWTFSS'[i]}</div>`}).join('')}</div>`}
  const good=m?dropN>=15:dropN>=4,nm=esc(D.set.name||'Adam');
  return `${back('home','Home')}<p class="h1">My stats</p>
<div class="seg" style="background:var(--card)"><button class="${m?'':'on'}" data-a="statsM" data-v="0">My week</button><button class="${m?'on':''}" data-a="statsM" data-v="1">My month</button></div>
<div class="g2"><div class="cd"><p class="s">Sessions</p><p class="big">${S.length}</p></div><div class="cd"><p class="s">Minutes trained</p><p class="big">${mins}</p></div></div>
<div class="cd"><p class="t" style="margin-bottom:12px">Sessions by training type</p><div class="hb">${byT.map(([n,v])=>`<span>${n}</span><span class="b"><span style="width:${v/mx*74}%"></span><b>${v}</b></span>`).join('')}</div></div>
<div class="cd"><p class="t">${ctitle}</p><div style="margin-top:6px">${chart(cl,cv,cmax,'Minutes',ticksFor(cmax,m?50:20))}</div></div>
<div class="cd col"><div><p class="t">Water drops</p><p class="s">A drop fills when you drink at least 1 litre</p></div>${drops}<p class="t" style="text-align:center">${dropN} drop${dropN===1?'':'s'} this ${m?'month':'week'}, ${good?'well done '+nm+'!':'keep going '+nm+'!'}</p></div>`;

const wheelItems=(n,step,dig,off)=>'<div></div>'+Array.from({length:n},(_,i)=>`<div>${dig?String(i*step+(off||0)):pad(i*step+(off||0))}</div>`).join('')+'<div></div>';
const wheel=(id,n,cap,dig,off)=>`<div class="whl"><button class="arr" data-a="wArr" data-v="${id},-1" aria-label="Down">${I('up')}</button><div class="wwrap"><div class="wcol" id="${id}" data-n="${n}">${wheelItems(n,1,dig,off)}</div></div><button class="arr" data-a="wArr" data-v="${id},1" aria-label="Up">${I('down')}</button>${cap?`<span class="wcap">${cap}</span>`:''}</div>`;
const WV={};
function bindWheels(onch){document.querySelectorAll('.wcol').forEach(c=>{const id=c.id;c.scrollTop=(WV[id]||0)*44;let rt;c.addEventListener('scroll',()=>{clearTimeout(rt);rt=setTimeout(()=>{WV[id]=Math.max(0,Math.min(+c.dataset.n-1,Math.round(c.scrollTop/44)));onch&&onch(id)},120)},{passive:true})})}
function wArr(id,d){const c=document.getElementById(id);if(!c)return;WV[id]=Math.max(0,Math.min(+c.dataset.n-1,(WV[id]||0)+d));c.scrollTo?c.scrollTo({top:WV[id]*44,behavior:'smooth'}):(c.scrollTop=WV[id]*44)}
V.timer=()=>{
  const cd=T.mode==='cd';
  return `<button class="bk" data-a="timerBack">${I('back')}Back</button><p class="h1">Timer</p>
<div class="seg"><button class="${cd?'':'on'}" data-a="tMode" data-v="sw">Stopwatch</button><button class="${cd?'on':''}" data-a="tMode" data-v="cd">Timer</button></div>
<div class="seg"><button class="${T.style==='d'?'on':''}" data-a="tStyle" data-v="d">Digital</button><button class="${T.style==='a'?'on':''}" data-a="tStyle" data-v="a">Analog</button></div>
<div id="tface">${faceHTML()}</div>
${cd&&!T.run?`<div class="cd"><div class="wheels">${wheel('wM',60,'min')}<span class="big" style="margin-bottom:22px">:</span>${wheel('wS',60,'sec')}</div></div>`:''}
<div class="g2"><button class="btn" id="tgo" data-a="tGo">${T.run?'Pause':T.done?'Done!':'Start'}</button><button class="btn ghost" data-a="tReset">Reset</button></div>`;

function faceHTML(){
  const cd=T.mode==='cd',shown=cd?Math.max(0,T.dur-T.el):T.el,txt=cd?mmss(Math.ceil(shown)):mmss(shown);
  if(T.style==='d')return `<p class="dig">${txt}</p>`;
  const frac=cd?(T.dur?shown/T.dur:0):(T.el%60)/60,a=frac*2*Math.PI-Math.PI/2,x=100+72*Math.cos(a),y=100+72*Math.sin(a);
  let tk='';for(let i=0;i<60;i++){const b=i/60*2*Math.PI,l=i%5?86:79;tk+=`<line x1="${(100+l*Math.cos(b)).toFixed(1)}" y1="${(100+l*Math.sin(b)).toFixed(1)}" x2="${(100+90*Math.cos(b)).toFixed(1)}" y2="${(100+90*Math.sin(b)).toFixed(1)}" stroke="var(--sub)" stroke-width="${i%5?1:2.4}"/>`}
  let arc='';if(cd&&frac>0.001&&frac<0.999){const big=frac>.5?1:0;arc=`<path d="M100 10 A90 90 0 ${big} 1 ${(100+90*Math.cos(a)).toFixed(2)} ${(100+90*Math.sin(a)).toFixed(2)}" fill="none" stroke="var(--ac)" stroke-width="6" stroke-linecap="round"/>`}else if(cd&&frac>=0.999)arc='<circle cx="100" cy="100" r="90" fill="none" stroke="var(--ac)" stroke-width="6"/>';
  return `<svg viewBox="0 0 200 200" width="240" height="240" style="display:block;margin:6px auto;max-width:100%" role="img" aria-label="${cd?'Timer':'Stopwatch'} ${txt}"><circle cx="100" cy="100" r="90" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>${tk}${arc}<line x1="100" y1="100" x2="${x.toFixed(2)}" y2="${y.toFixed(2)}" stroke="var(--ac)" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="var(--ac)"/><text x="100" y="148" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-size="26" font-weight="700" fill="var(--tx)">${txt}</text></svg>`;
}

V.recover=()=>{

<div class="g2">${B.map(b=>`<button class="chip${x.body&&x.body.state===b[0]?' on':''}" data-a="body" data-v="${b[0]}">${b[1]}</button>`).join('')}</div>
${x.body?`<input class="inp" id="bnote" maxlength="120" placeholder="Anything to add? (optional)" value="${esc(x.body.note||'')}" aria-label="Body check note">`:''}
${hurtMsg?`<p class="t" style="color:var(--warn);font-size:14px">${hurtMsg}</p>`:''}</div>
<button class="cd row" style="text-align:left" data-a="go" data-v="cool"><span style="color:var(--ac)">${I('stretch')}</span><p class="t" style="flex:1">Cool down stretches</p>${I('right')}</button>

  const v=U.view,fn=V[v]||V.home;
  main.innerHTML=fn();
  const noNav=v==='welcome'||v==='move'||v==='finish'||(v==='timer'&&U.timerFrom==='move');

  if(!noNav){const cur=TAB_OF[v]||'home';document.getElementById('tabsIn').innerHTML=TABS.map(t=>`<button class="${cur===t[0]?'on':''}" data-a="tab" data-v="${t[0]}" aria-label="${t[1]}">${I(t[2])}${t[1]}</button>`).join('')}

/* ---------- timer ---------- */
function setupWheels(){WV.wM=Math.floor(T.dur/60);WV.wS=T.dur%60;bindWheels(()=>{if(T.run)return;T.dur=(WV.wM||0)*60+(WV.wS||0);T.el=0;T.done=false;updFace()})}
function updFace(){const f=document.getElementById('tface');if(f)f.innerHTML=faceHTML();const g=document.getElementById('tgo');if(g)g.textContent=T.run?'Pause':T.done?'Done!':'Start';const mi=document.getElementById('tmini');if(mi)mi.textContent=T.run?mmss(T.mode==='sw'?T.el:T.dur-T.el):'Timer'}
function beep(){try{const c=T.ac;if(!c)return;const notes=[659.25,783.99,1046.5];for(let r=0;r<3;r++)notes.forEach((f,i)=>{const t=c.currentTime+r*.9+i*.16,o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.5);o.start(t);o.stop(t+.55)})}catch(e){}}
async function wake(on){try{if(on&&navigator.wakeLock&&!T.lock){T.lock=await navigator.wakeLock.request('screen')}else if(!on&&T.lock){await T.lock.release();T.lock=null}}catch(e){T.lock=null}}
function tStop(){T.run=false;clearInterval(T.iv);T.iv=null;wake(false)}
function tStart(){
  if(T.mode==='cd'){if(!T.dur){toast('Set a time first');return}if(T.el>=T.dur)T.el=0}
  try{if(!T.ac){const AC=window.AudioContext||window.webkitAudioContext;if(AC)T.ac=new AC()}if(T.ac&&T.ac.state==='suspended')T.ac.resume()}catch(e){}
  T.done=false;T.run=true;T.t0=performance.now()-T.el*1000;wake(true);
  T.iv=setInterval(()=>{T.el=(performance.now()-T.t0)/1000;if(T.mode==='cd'&&T.el>=T.dur){T.el=T.dur;tStop();T.done=true;beep();toast("Time's up!");if(U.view==='timer')render();else updFace();return}updFace()},100);
  if(U.view==='timer')render();
}

function hx(r,g,b){return '#'+[r,g,b].map(v=>pad(Math.max(0,Math.min(255,Math.round(v))).toString(16))).join('')}
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6}return[h,s,l]}
function hsl2hex(h,s,l){const f=n=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l);return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return hx(f(0)*255,f(8)*255,f(4)*255)}
function palFrom(img){
  const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d');x.drawImage(img,0,0,48,48);const d=x.getImageData(0,0,48,48).data;
  const B=Array.from({length:12},()=>({w:0,h:0,s:0,l:0}));let R=0,G=0,Bl=0,n=0,L=0;
  for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];R+=r;G+=g;Bl+=b;n++;const[h,s,l]=rgb2hsl(r,g,b);L+=l;if(s>.25&&l>.15&&l<.85){const k=Math.floor(h*12)%12,w=s*(1-Math.abs(l-.5));B[k].w+=w;B[k].h+=h*w;B[k].s+=s*w;B[k].l+=l*w}}
  const avg=rgb2hsl(R/n,G/n,Bl/n),dark=L/n<.55;
  const order=B.map((b,i)=>[b.w,i]).sort((a,b)=>b[0]-a[0]);
  const pick=i=>{const b=B[i];return b.w?[b.h/b.w,b.s/b.w,b.l/b.w]:null};
  let a1=pick(order[0][1])||[avg[0],.5,.55];
  let a2=null;for(const[w,i]of order.slice(1)){if(!w)break;const dist=Math.min(Math.abs(i-order[0][1]),12-Math.abs(i-order[0][1]));if(dist>=2){a2=pick(i);break}}
  const tune=(c,light)=>[c[0],Math.max(.45,Math.min(.9,c[1])),light?Math.max(.6,Math.min(.72,c[2])):Math.max(.32,Math.min(.42,c[2]))];
  a1=tune(a1,dark);a2=a2?tune(a2,dark):[a1[0],a1[1]*.6,dark?.82:.3];
  const bh=a1[0],bs=Math.min(.35,avg[1]+.1);
  return dark?{dark:1,bg:hsl2hex(bh,bs,.09),card:hsl2hex(bh,bs,.15),line:hsl2hex(bh,bs,.26),tx:'#FFFFFF',sub:hsl2hex(bh,.15,.78),ac:hsl2hex(...a1),ac2:hsl2hex(...a2)}
             :{dark:0,bg:hsl2hex(bh,bs,.93),card:hsl2hex(bh,bs*.6,.97),line:hsl2hex(bh,bs,.84),tx:hsl2hex(bh,.3,.12),sub:hsl2hex(bh,.15,.38),ac:hsl2hex(...a1),ac2:hsl2hex(...a2)};
}

function loadPhoto(file){
  const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,900/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const prev=D.set.photo,pb=D.set.bg;D.set.photo=c.toDataURL('image/jpeg',0.72);D.set.bg='photo';try{D.set.photoPal=palFrom(c)}catch(e){D.set.photoPal=null}if(!save()){D.set.photo=prev;D.set.bg=pb;toast('That photo is too big. Try another one.')}render()};img.onerror=()=>toast("Couldn't open that photo.");img.src=rd.result};rd.readAsDataURL(file);

const csvCell=v=>{const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const toCSV=t=>[t.h].concat(t.r).map(r=>r.map(csvCell).join(',')).join('\n');
async function deliver(files){
  try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,title:'PFJ data'});return true}}catch(e){if(e&&e.name==='AbortError')return true}
  try{for(const f of files){const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();await new Promise(r=>setTimeout(r,350))}return true}catch(e){return false}
}
async function exportCSV(){
  const Tb=tables(),stamp=TK();
  if(PREVIEW){U.dump={note:'Exporting files works once the app is installed from GitHub. In the preview you can copy the data instead. Each table has its own heading.',text:Tb.map(t=>'### '+t.title+'\n'+toCSV(t)).join('\n\n')};go('dump');return}
  const files=Tb.map(t=>new File([toCSV(t)],`pfj_${t.name}_${stamp}.csv`,{type:'text/csv'}));
  if(!(await deliver(files))){U.err="Couldn't export. Try again.";render()}
}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function exportPDF(){
  if(PREVIEW){U.err='PDF export works once the app is installed from GitHub.';render();return}
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
    const doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
    doc.setFontSize(18);doc.text('PFJ data · '+(D.set.name||'Adam'),40,48);doc.setFontSize(10);doc.text('Exported '+longDate(TK()),40,66);
    let y=86;
    tables().forEach(t=>{if(y>720){doc.addPage();y=48}doc.setFontSize(13);doc.text(t.title,40,y);doc.autoTable({head:[t.h],body:t.r.length?t.r:[['No data yet']],startY:y+8,styles:{fontSize:8},headStyles:{fillColor:[60,70,80]},margin:{left:40,right:40}});y=doc.lastAutoTable.finalY+28});
    const f=new File([doc.output('blob')],'pfj_data_'+TK()+'.pdf',{type:'application/pdf'});
    if(!(await deliver([f]))){U.err="Couldn't export. Try again.";render()}
  }catch(e){U.err='PDF needs internet the first time. Connect and try again.';render()}
}

function confetti(){
